# COMPAT = the OS's native encoding. Needed on Windows when the repo path has non-ASCII
# characters (e.g. "Ciúin"): otherwise test JVMs can't load classes from the mangled classpath.
# Same as UTF-8 on macOS/Linux. Kotlin sources are always compiled as UTF-8 regardless.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=COMPAT
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# Repo may live under a non-ASCII path (e.g. "Ciúin"); AGP refuses by default on Windows.
android.overridePathCheck=true
