name: iosApp
packages:
  LiteRT:
    url: https://github.com/google-ai-edge/LiteRT-Swift.git
    exactVersion: 2.3.0
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes: [Info.plist]
      # Poppins (four weights and its licence), shared with Android and desktop.
      - path: ../composeApp/src/commonMain/fontRes
        name: Poppins
        buildPhase: resources
      - path: ../data/processed/places_lausanne.geojson
        buildPhase: resources
      - path: ../ml/export/audio-student-s.tflite
        buildPhase: resources
      - path: ../ml/export/audio-student-m.tflite
        buildPhase: resources
    dependencies:
      - package: LiteRT
        product: LiteRT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.ciuin.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CIUIN_API_URL: "https://ciuin-production.up.railway.app"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
    preBuildScripts:
      - name: Build ComposeApp framework
        basedOnDependencyAnalysis: false
        script: |
          set -e
          jdk17=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
          if [ -z "${JAVA_HOME+x}" ] && [ -d "$jdk17" ]; then
            export JAVA_HOME="$jdk17"
          fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iosAppTests
        optional: true
      - path: ../ml/export/test_clips
        type: folder
        buildPhase: resources
    dependencies:
      - target: iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    test:
      targets:
        - iosAppTests
